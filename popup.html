<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #141414;
      color: #e5e5e5;
    }
    h1 { font-size: 14px; margin: 0 0 10px; color: #e50914; }
    label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    textarea {
      width: 100%;
      height: 90px;
      margin-top: 10px;
      box-sizing: border-box;
      background: #222;
      color: #e5e5e5;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 12px;
      padding: 6px;
      resize: vertical;
    }
    .hint { font-size: 11px; color: #999; margin: 6px 0; }
    button {
      width: 100%;
      padding: 7px 0;
      background: #e50914;
      color: #fff;
      border: 0;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #f6121d; }
    #saved { font-size: 11px; color: #46d369; height: 14px; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <h1>Netflix Regional Filter</h1>
  <label>
    <input type="checkbox" id="enabled" />
    Filter enabled
  </label>
  <textarea id="terms" placeholder="Extra words or exact titles to block, one per line"></textarea>
  <p class="hint">Built-in filters already cover Indian category rows, well-known titles, and Indic-script text. Add anything it misses here.</p>
  <button id="save">Save</button>
  <div id="saved"></div>
  <script src="popup.js"></script>
</body>
</html>
