name: Tests
on:
  push:
    branches: [master]
    paths: ["*.js", "manifest.json", "popup.html", "package*.json", "scripts/**", "test/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["*.js", "manifest.json", "popup.html", "package*.json", "scripts/**", "test/**", ".github/workflows/test.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
